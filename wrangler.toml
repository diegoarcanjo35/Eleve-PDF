# Configuração do Cloudflare Pages para o ElevePDF.
#
# Bancos D1 reais (Fase 2.3E): produção usa `elevepdf-analytics`, preview usa
# `elevepdf-analytics-preview`, ambos criados na conta Criativoselevados@gmail.com.
# `d1_databases` não é uma chave herdável em Pages (ver docs oficiais de Wrangler
# Configuration para Pages), então o binding de preview é declarado de forma
# explícita e completa em [[env.preview.d1_databases]], sem depender de herança
# do bloco top-level — que serve à produção e ao `wrangler pages dev --local`
# (que usa emulação local de D1 por padrão e ignora o `database_id` real).
name = "eleve-pdf"
pages_build_output_dir = "dist"
compatibility_date = "2026-01-01"

[[d1_databases]]
binding = "DB"
database_name = "elevepdf-analytics"
database_id = "9efbfa40-2e1d-4f7b-82c9-68b99502ddb9"
migrations_dir = "migrations"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "elevepdf-analytics-preview"
database_id = "38e7597b-692b-4545-9930-0a0a9fdaef6e"
migrations_dir = "migrations"

# --- Inteligência Documental (Fase 01, Sprint 01B / 01B.1) ---
# D1 dedicado, isolado do D1 de Analytics acima — sessões/chunks de IA nunca
# compartilham tabela ou binding com `analytics_events`. Provisionado
# exclusivamente na conta diego.upis@gmail.com (Account ID
# fd553a9aacdf161483f2e376a16a9a4d — ver Fase 01 Etapa 03B), a mesma conta
# nova usada para a demais infra de Inteligência Documental. Migration
# `migrations-intelligence/0001_intelligence_foundation.sql` já aplicada em
# ambos (produção e preview) — ver relatório Sprint 01B.1.
[[d1_databases]]
binding = "INTEL_DB"
database_name = "elevepdf-intelligence"
database_id = "c201632f-d197-4623-8bb5-d05ff1985b8f"
migrations_dir = "migrations-intelligence"

[[env.preview.d1_databases]]
binding = "INTEL_DB"
database_name = "elevepdf-intelligence-preview"
database_id = "4611d5d6-9e05-4eb8-a4c5-195320f42aa8"
migrations_dir = "migrations-intelligence"

# --- Embeddings + Vectorize (Fase 01, Sprint 01C) ---
# Workers AI (modelo @cf/baai/bge-m3 exclusivamente — ver constants.ts) e o
# Vectorize já existente `elevepdf-conversar-pdf-embeddings` (dimensões
# 1024, métrica cosine — criado na Etapa 03B, mesma conta diego.upis@gmail.com).
# `ai` e `vectorize` são chaves não-herdáveis em Pages (confirmado na
# documentação oficial), e como `d1_databases`/`vars` já são sobrescritos em
# [env.preview], TODAS as chaves não-herdáveis precisam ser repetidas lá —
# por isso o bloco abaixo é duplicado, apontando para o mesmo índice/conta
# (não existe um segundo Vectorize de preview; é o mesmo recurso).
[ai]
binding = "AI"

[[vectorize]]
binding = "VECTORIZE"
index_name = "elevepdf-conversar-pdf-embeddings"

[env.preview.ai]
binding = "AI"

[[env.preview.vectorize]]
binding = "VECTORIZE"
index_name = "elevepdf-conversar-pdf-embeddings"

# Variáveis usadas pelos endpoints de Analytics — ver functions/api/analytics/.
# CF_ACCESS_TEAM_DOMAIN e CF_ACCESS_AUD ficam ausentes de propósito: enquanto
# não forem configuradas em produção, GET /api/analytics/summary responde 503
# (painel bloqueado por padrão — ver relatório, "Proteção obrigatória").
# ANALYTICS_ALLOW_PAGES_PREVIEW fica "false" aqui de propósito — só é "true"
# em [env.preview.vars], para liberar Origin/Host de *.eleve-pdf.pages.dev
# somente nos deployments de preview (ver functions/_shared/origin.ts).
[vars]
ANALYTICS_ALLOW_LOCAL_DEV = "false"
ANALYTICS_ALLOW_PAGES_PREVIEW = "false"

# `vars` também não é herdável: como env.preview já sobrescreve d1_databases,
# precisa repetir vars aqui — senão o preview perde ANALYTICS_ALLOW_LOCAL_DEV
# e ANALYTICS_ALLOW_PAGES_PREVIEW.
[env.preview.vars]
ANALYTICS_ALLOW_LOCAL_DEV = "false"
ANALYTICS_ALLOW_PAGES_PREVIEW = "true"
